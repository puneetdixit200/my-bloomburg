    topic: hackathon opportunities
    score: 72
    max_pages: 20
    follow_links: true
    include_patterns:
      - /hackathons
      - /software/
      - /challenge/
    exclude_patterns:
      - /users/
      - /portfolio
      - /login
      - /auth

