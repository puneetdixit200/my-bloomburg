x-radar-environment: &radar-environment
  INTERNET_RADAR_DB: /data/radar.sqlite
  INTERNET_RADAR_USE_LIVE: ${INTERNET_RADAR_USE_LIVE:-0}
  INTERNET_RADAR_DISPATCH_ALERTS: ${INTERNET_RADAR_DISPATCH_ALERTS:-0}
  INTERNET_RADAR_STORAGE_BACKEND: ${INTERNET_RADAR_STORAGE_BACKEND:-sqlite}
  INTERNET_RADAR_VECTOR_BACKEND: ${INTERNET_RADAR_VECTOR_BACKEND:-auto}
  INTERNET_RADAR_CHROMA_PATH: ${INTERNET_RADAR_CHROMA_PATH:-/data/chroma}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  SUPABASE_TABLE: ${SUPABASE_TABLE:-signals}
  INTERNET_RADAR_NTFY_TOPIC: ${INTERNET_RADAR_NTFY_TOPIC:-}
  INTERNET_RADAR_NTFY_SERVER: ${INTERNET_RADAR_NTFY_SERVER:-https://ntfy.sh}
  OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  LIBRARIES_IO_API_KEY: ${LIBRARIES_IO_API_KEY:-}
  REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
  REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  PRODUCTHUNT_TOKEN: ${PRODUCTHUNT_TOKEN:-}
  ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
  ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  CRUNCHBASE_API_KEY: ${CRUNCHBASE_API_KEY:-}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  HACKEREARTH_API_KEY: ${HACKEREARTH_API_KEY:-}
  SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
  MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
  INTERNET_RADAR_EMAIL_TO: ${INTERNET_RADAR_EMAIL_TO:-}
  INTERNET_RADAR_EMAIL_FROM: ${INTERNET_RADAR_EMAIL_FROM:-}

services:
  dashboard:
    image: python:3.12-slim
    working_dir: /app
    environment:
      <<: *radar-environment
    volumes:
      - .:/app
      - radar-data:/data
    ports:
      - "8501:8501"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501"

  scheduler:
    image: python:3.12-slim
    working_dir: /app
    profiles:
      - background
    environment:
      <<: *radar-environment
    volumes:
      - .:/app
      - radar-data:/data
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python scheduler/runner.py"

  telegram-bot:
    image: python:3.12-slim
    working_dir: /app
    profiles:
      - alerts
    environment:
      <<: *radar-environment
    volumes:
      - .:/app
      - radar-data:/data
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python alerts/telegram_bot.py --watch"

  ollama:
    image: ollama/ollama:latest
    profiles:
      - local-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  radar-data:
  ollama:
