[project]
name = "internet-radar-v2"
version = "0.1.0"
description = "Local-first Internet Radar v2 signal intelligence dashboard"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
    "streamlit>=1.36",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
]

[project.scripts]
internet-radar-run = "internet_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["internet_radar"]
